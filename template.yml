AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: YoProgrammer Backend

Parameters:
  Stage:
    Type: String
    AllowedValues:
      - dev
      - prod
    Default: dev

  BedrockModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0

  SQSQueueUrl:
    Type: String

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 29
    MemorySize: 512

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "yoprogrammer-user-pool-${Stage}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: false
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UserPoolTags:
        Stage: !Ref Stage

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "yoprogrammer-client-${Stage}"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "yoprogrammer-${Stage}"
      UserPoolId: !Ref UserPool

  SnippetsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "yoprogrammer-snippets-${Stage}"
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: snippetId
          AttributeType: S
        - AttributeName: language
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: snippetId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByLanguage
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: language
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ByCreatedAt
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  EmbeddingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "yoprogrammer-embeddings-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: snippetId
          AttributeType: S
      KeySchema:
        - AttributeName: snippetId
          KeyType: HASH

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"

  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"

  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolArn"

  UserPoolDomain:
    Value: !Sub "yoprogrammer-${Stage}"
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolDomain"

  SnippetsTableName:
    Value: !Ref SnippetsTable
    Export:
      Name: !Sub "${AWS::StackName}-SnippetsTableName"

  SnippetsTableArn:
    Value: !GetAtt SnippetsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-SnippetsTableArn"

  SnippetsTableStreamArn:
    Value: !GetAtt SnippetsTable.StreamArn
    Export:
      Name: !Sub "${AWS::StackName}-SnippetsTableStreamArn"

  EmbeddingsTableName:
    Value: !Ref EmbeddingsTable
    Export:
      Name: !Sub "${AWS::StackName}-EmbeddingsTableName"

  EmbeddingsTableArn:
    Value: !GetAtt EmbeddingsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EmbeddingsTableArn"
