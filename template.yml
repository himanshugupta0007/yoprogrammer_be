AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: YoProgrammer Backend

Parameters:
  Stage:
    Type: String
    AllowedValues:
      - dev
      - prod
    Default: dev

  BedrockModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - x86_64
    Timeout: 29
    MemorySize: 512
    Environment:
      Variables:
        USER_POOL_CLIENT_ID: !Ref UserPoolClient
        USER_POOL_ID: !Ref UserPool
        POWERTOOLS_SERVICE_NAME: !Sub "${AWS::StackName}"
        POWERTOOLS_METRICS_NAMESPACE: YoProgrammer
        LOG_LEVEL: INFO

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "yoprogrammer-user-pool-${Stage}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: false
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UserPoolTags:
        Stage: !Ref Stage

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "yoprogrammer-client-${Stage}"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - implicit
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - http://localhost:3000/callback
      LogoutURLs:
        - http://localhost:3000
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "yoprogrammer-${Stage}"
      UserPoolId: !Ref UserPool

  SnippetsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "yoprogrammer-snippets-${Stage}"
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: snippetId
          AttributeType: S
        - AttributeName: language
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: snippetId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByLanguage
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: language
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ByCreatedAt
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  EmbeddingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "yoprogrammer-embeddings-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: snippetId
          AttributeType: S
      KeySchema:
        - AttributeName: snippetId
          KeyType: HASH

  YoProgrammerApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Authorization,Content-Type'"
        AllowMethods: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title: !Sub "yoprogrammer-api-${Stage}"
          version: "1.0"
        paths:
          /health:
            get:
              summary: Health check
              security: []
              x-amazon-apigateway-integration:
                type: mock
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: "200"
                    responseTemplates:
                      application/json: '{"status":"ok"}'
              responses:
                "200":
                  description: OK

  EmbeddingDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "yoprogrammer-embedding-dlq-${Stage}"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "yoprogrammer-lambda-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SnippetsTableAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt SnippetsTable.Arn
                  - !Sub "${SnippetsTable.Arn}/index/*"
        - PolicyName: EmbeddingsTableAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt EmbeddingsTable.Arn
                  - !Sub "${EmbeddingsTable.Arn}/index/*"
        - PolicyName: EmbeddingQueueAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                Resource: !GetAtt EmbeddingQueue.Arn
        - PolicyName: BedrockInvokeAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
  EmbeddingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "yoprogrammer-embedding-queue-${Stage}"
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EmbeddingDLQ.Arn
        maxReceiveCount: 3

  AuthSignUpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/yoprogrammer-auth-signup-${Stage}"
      RetentionInDays: 7

  AuthConfirmLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/yoprogrammer-auth-confirm-${Stage}"
      RetentionInDays: 7

  AuthSignInLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/yoprogrammer-auth-signin-${Stage}"
      RetentionInDays: 7

  AuthForgotPasswordLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/yoprogrammer-auth-forgot-password-${Stage}"
      RetentionInDays: 7

  AuthResetPasswordLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/yoprogrammer-auth-reset-password-${Stage}"
      RetentionInDays: 7

  AuthSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "yoprogrammer-auth-signup-${Stage}"
      CodeUri: .
      Handler: src/handlers/auth/signUp.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        SignUp:
          Type: Api
          Properties:
            RestApiId: !Ref YoProgrammerApi
            Path: /auth/signup
            Method: POST
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - src/handlers/auth/signUp.ts

  AuthConfirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "yoprogrammer-auth-confirm-${Stage}"
      CodeUri: .
      Handler: src/handlers/auth/confirmSignUp.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ConfirmSignUp:
          Type: Api
          Properties:
            RestApiId: !Ref YoProgrammerApi
            Path: /auth/confirm
            Method: POST
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - src/handlers/auth/confirmSignUp.ts

  AuthSignInFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "yoprogrammer-auth-signin-${Stage}"
      CodeUri: src/
      Handler: handlers/auth/signIn.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        SignIn:
          Type: Api
          Properties:
            RestApiId: !Ref YoProgrammerApi
            Path: /auth/signin
            Method: POST
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - src/handlers/auth/signIn.ts

  AuthForgotPasswordFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "yoprogrammer-auth-forgot-password-${Stage}"
      CodeUri: src/
      Handler: handlers/auth/forgotPassword.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ForgotPassword:
          Type: Api
          Properties:
            RestApiId: !Ref YoProgrammerApi
            Path: /auth/forgot-password
            Method: POST
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - src/handlers/auth/forgotPassword.ts

  AuthResetPasswordFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "yoprogrammer-auth-reset-password-${Stage}"
      CodeUri: src/
      Handler: handlers/auth/resetPassword.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ResetPassword:
          Type: Api
          Properties:
            RestApiId: !Ref YoProgrammerApi
            Path: /auth/reset-password
            Method: POST
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - src/handlers/auth/resetPassword.ts

  EmbeddingDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-embedding-dlq-depth"
      AlarmDescription: Messages in the embedding DLQ indicate failed processing
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EmbeddingDLQ.QueueName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"

  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"

  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolArn"

  UserPoolDomain:
    Value: !Sub "yoprogrammer-${Stage}"
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolDomain"

  SnippetsTableName:
    Value: !Ref SnippetsTable
    Export:
      Name: !Sub "${AWS::StackName}-SnippetsTableName"

  SnippetsTableArn:
    Value: !GetAtt SnippetsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-SnippetsTableArn"

  SnippetsTableStreamArn:
    Value: !GetAtt SnippetsTable.StreamArn
    Export:
      Name: !Sub "${AWS::StackName}-SnippetsTableStreamArn"

  EmbeddingsTableName:
    Value: !Ref EmbeddingsTable
    Export:
      Name: !Sub "${AWS::StackName}-EmbeddingsTableName"

  EmbeddingsTableArn:
    Value: !GetAtt EmbeddingsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EmbeddingsTableArn"

  EmbeddingQueueUrl:
    Value: !Ref EmbeddingQueue
    Export:
      Name: !Sub "${AWS::StackName}-EmbeddingQueueUrl"

  EmbeddingQueueArn:
    Value: !GetAtt EmbeddingQueue.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EmbeddingQueueArn"

  ApiGatewayUrl:
    Value: !Sub "https://${YoProgrammerApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiGatewayUrl"
